<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Управление предприятием</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: header with three workspaces (Заказы · Бухгалтерия · План-график); orders = project tree + order sheet; accounting = grouped payables; plan = Gantt. */
:root{
  --paper:#F4F6F5; --sheet:#FFFFFF; --ink:#1A2230; --ink-2:#556071; --rule:#DBE0E3; --rule-2:#ECEFF1;
  --stamp:#3446B8; --stamp-soft:#E6E9FA; --stamp-ink:#FFFFFF;
  --work:#0E7470; --work-soft:#D9F1EF;
  --ok:#1E7A4F; --ok-soft:#DFF2E7; --warn:#A35A00; --warn-soft:#FBEBD3; --bad:#B42323; --bad-soft:#FBE1E1;
  --info:#255F9E; --info-soft:#DDEBF8; --mute:#6A7380; --mute-soft:#EDEFF2;
  --shadow:0 12px 40px rgba(20,30,50,.18);
  --f-display:"Unbounded","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151B; --sheet:#181E26; --ink:#E6EAF0; --ink-2:#9AA5B4; --rule:#2C343F; --rule-2:#222932;
  --stamp:#8C9BFF; --stamp-soft:#252C55; --stamp-ink:#0E1220; --work:#4FD1C5; --work-soft:#173634;
  --ok:#5CCB92; --ok-soft:#173327; --warn:#F0AE55; --warn-soft:#3A2A14; --bad:#FF7B7B; --bad-soft:#3E1C1F;
  --info:#7DB4F0; --info-soft:#1A2D44; --mute:#98A1AD; --mute-soft:#232A33; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151B; --sheet:#181E26; --ink:#E6EAF0; --ink-2:#9AA5B4; --rule:#2C343F; --rule-2:#222932;
  --stamp:#8C9BFF; --stamp-soft:#252C55; --stamp-ink:#0E1220; --work:#4FD1C5; --work-soft:#173634;
  --ok:#5CCB92; --ok-soft:#173327; --warn:#F0AE55; --warn-soft:#3A2A14; --bad:#FF7B7B; --bad-soft:#3E1C1F;
  --info:#7DB4F0; --info-soft:#1A2D44; --mute:#98A1AD; --mute-soft:#232A33; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
a{color:var(--stamp)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--ink-2)}
.r{text-align:right}
h2,h3{text-wrap:balance;margin:0}

header.top{background:var(--sheet);border-bottom:1px solid var(--rule)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;gap:12px;align-items:center}
h1{font:600 clamp(16px,2.2vw,20px)/1.2 var(--f-display);margin:0}
.sub{color:var(--ink-2);font-size:13px;margin:2px 0 0}
nav.views{display:flex;gap:4px;background:var(--mute-soft);padding:4px;border-radius:10px;flex-wrap:wrap}
nav.views a{padding:7px 14px;border-radius:7px;text-decoration:none;color:var(--ink-2);font-weight:500;display:flex;gap:6px;align-items:center}
nav.views a.on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.badge{background:var(--bad);color:var(--sheet);border-radius:999px;font-size:11px;font-weight:600;padding:0 6px;min-width:18px;text-align:center}

.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:var(--stamp-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{border:0;background:transparent;cursor:pointer;color:var(--ink-2);padding:4px 6px;border-radius:6px}
.icon:hover{background:var(--mute-soft);color:var(--ink)}
.icon.armed{background:var(--bad);color:var(--sheet)}
.row-g{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.banner{margin:0 0 16px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:14px}
main{padding-block:20px 48px}
.empty{padding:48px 20px;text-align:center;color:var(--ink-2);background:var(--sheet);border:1px dashed var(--rule);border-radius:12px}
.empty h3{font:600 16px var(--f-display);color:var(--ink);margin:0 0 6px}
.empty .row-g{justify-content:center;margin-top:14px}

.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.c-new,.c-info{background:var(--info-soft);color:var(--info)}
.c-work{background:var(--stamp-soft);color:var(--stamp)}
.c-closed,.c-mute{background:var(--mute-soft);color:var(--mute)}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)}
.ex{font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px}

/* Orders */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.olist{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.pgroup{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:12px 12px 10px 14px;border-bottom:1px solid var(--rule-2)}
.ph b{font-weight:600}
.ph small{display:block;color:var(--ink-2);font-size:12px}
.ph-act{display:flex;gap:2px;align-items:center;flex:none}
.oitem{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--rule-2);padding:10px 14px;cursor:pointer}
.oitem:first-of-type{border-top:0}
.oitem:hover{background:var(--paper)}
.oitem.on{background:var(--stamp-soft);box-shadow:inset 3px 0 0 var(--stamp)}
.oitem .mono{font-size:13px;color:var(--ink-2)}
.oitem .ot{font-weight:500;overflow-wrap:anywhere}
.oitem .oc{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.olist-top{display:flex;gap:8px}
.ogroup{border-top:1px solid var(--rule)}
.ogroup:first-child{border-top:0}
.ogroup>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:var(--mute-soft);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.ogroup>summary::-webkit-details-marker{display:none}
.ogroup>summary::after{content:"▾";font-size:12px;transition:transform .15s}
.ogroup:not([open])>summary::after{transform:rotate(-90deg)}
.ogroup>summary .cnt{margin-left:auto;margin-right:8px;font-variant-numeric:tabular-nums}
.ogroup .oitem:first-of-type{border-top:0}
.ocm{display:block;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ocm b{font-weight:600;color:var(--ink)}
.comments{display:flex;flex-direction:column;gap:10px}
.cmt{display:flex;gap:10px;align-items:flex-start}
.cmt .avatar{width:28px;height:28px;font-size:11px}
.cmt .body{flex:1;min-width:0;background:var(--paper);border:1px solid var(--rule-2);border-radius:10px;padding:8px 12px}
.cmt .meta{font-size:12px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.cmt .meta .icon{margin-left:auto;padding:0 4px}
.cmt p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.cform{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.cform textarea{min-height:44px;flex:1}
.cphint{font-size:13px;margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cpcard dl{margin:0}
.roles-chips{display:flex;gap:6px;flex-wrap:wrap}
.olist-top .in{flex:1;min-width:0}
.ometa{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.pad{padding:10px 14px;margin:0;font-size:14px}
.odetail{display:flex;flex-direction:column;gap:16px;min-width:0}
.back{display:none;align-self:flex-start}
.ohead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.bill{margin-top:4px;font-size:14px}
.bill b{font-weight:600}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--stamp);font-weight:600}
.ohead h2{font:600 clamp(17px,2.2vw,21px)/1.3 var(--f-display);overflow-wrap:anywhere}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.kpis>div{background:var(--sheet);padding:12px 14px;min-width:0}
.kpis span{display:block;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.kpis b{font:500 17px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpis b.bad{color:var(--bad)}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;min-width:0}
.ch{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ch h3{font-size:15px;font-weight:600}
.hint{font-size:12px;color:var(--ink-2);margin:8px 0 0}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;gap:10px;align-items:center;border:1px solid var(--rule-2);border-radius:8px;padding:7px 10px;font-size:14px}
.files a{overflow-wrap:anywhere;min-width:0;flex:1}
.files small{color:var(--ink-2);white-space:nowrap}

.tscroll{overflow-x:auto;border:1px solid var(--rule-2);border-radius:8px}
table.comp{border-collapse:collapse;width:100%;min-width:900px;font-size:14px}
.comp th{background:var(--mute-soft);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);text-align:left;padding:7px 8px;white-space:nowrap}
.comp th.r{text-align:right}
.comp td{border-top:1px solid var(--rule-2);padding:3px 4px;vertical-align:middle}
.comp td.n{color:var(--ink-2);text-align:right;padding-right:8px;width:36px}
.comp input,.comp select{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px}
.comp input:hover,.comp select:hover{border-color:var(--rule)}
.comp input:focus{border-color:var(--stamp);background:var(--sheet);outline:none}
.comp input.num{text-align:right;font-family:var(--f-mono)}
.comp .csum{text-align:right;font-family:var(--f-mono);white-space:nowrap;padding-right:8px}
.comp tfoot td{font-weight:600;padding:8px;white-space:nowrap}
.comp td.emptyrow{text-align:center;color:var(--ink-2);padding:20px}

.ilist{display:flex;flex-direction:column;container-type:inline-size}
.irow{display:grid;grid-template-columns:104px 130px minmax(0,1fr) 110px 150px 140px 118px;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--rule-2);cursor:pointer}
.irow:first-child{border-top:0}
.irow:hover{background:var(--paper)}
.irow small{display:block;color:var(--ink-2);font-size:12px}
.isup{min-width:0}
.isup b{font-weight:500;overflow-wrap:anywhere}
.isup small{overflow-wrap:anywhere}
.idue{font-variant-numeric:tabular-nums;font-size:14px}
.idue.bad{color:var(--bad);font-weight:600}
.iamt{text-align:right;font-weight:500;white-space:nowrap}
.ifiles{display:flex;gap:4px 8px;font-size:13px;flex-wrap:wrap;align-items:center}
.seen{color:var(--ok);font-size:12px;white-space:nowrap}
.unseen-note{color:var(--ink-2);font-size:12px;white-space:nowrap}
.irow.unseen{box-shadow:inset 3px 0 0 var(--stamp);background:color-mix(in srgb,var(--stamp-soft) 45%,transparent)}
.irow.unseen .isup b{font-weight:600}
.urow{display:grid;grid-template-columns:minmax(0,1fr) 130px 130px 160px 310px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--rule-2)}
.urow:first-child{border-top:0}
.urow.head{background:var(--mute-soft);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);padding-block:8px}
.urow b{font-weight:500;overflow-wrap:anywhere}
.urow small{display:block;color:var(--ink-2);font-size:12px}
.urow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.urow.blocked b{color:var(--ink-2);text-decoration:line-through}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:16px}
.roles div{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;font-size:14px}
.roles b{display:block;margin-bottom:4px}
@media (max-width:820px){.urow{grid-template-columns:1fr auto;grid-template-areas:"who role" "st last" "acts acts"}.urow.head{display:none}
  .urow>:nth-child(1){grid-area:who}.urow>:nth-child(2){grid-area:role;text-align:right}.urow>:nth-child(3){grid-area:st}.urow>:nth-child(4){grid-area:last;text-align:right}.urow>:nth-child(5){grid-area:acts;justify-content:flex-start}}
@container (max-width:900px){
  .irow{grid-template-columns:auto 1fr auto;grid-template-areas:"st num amt" "sup sup sup" "due files act";gap:4px 10px}
  .ist{grid-area:st}.inum{grid-area:num}.iamt{grid-area:amt}.isup{grid-area:sup}.idue{grid-area:due}.ifiles{grid-area:files}.iact{grid-area:act}
  .inum small,.idue small{display:inline;margin-right:4px}
  .inum small{margin-left:6px}
}

.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tlist li{display:flex;gap:10px;align-items:center;font-size:14px;padding:7px 10px;border:1px solid var(--rule-2);border-radius:8px;cursor:pointer;flex-wrap:wrap}
.tlist li:hover{background:var(--paper)}
.tlist .t{flex:1;min-width:140px;overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.dot.buy{background:var(--stamp)}.dot.work{background:var(--work)}

@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .olist{position:static}
  .split.has-sel .olist{display:none}
  .split:not(.has-sel) .odetail{display:none}
  .back{display:inline-flex}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* Accounting */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:flex;background:var(--mute-soft);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--sheet);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
select.f{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:7px 10px;max-width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:20px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;min-width:0}
.tile span{display:block;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.tile b{display:block;font:600 clamp(17px,2vw,22px)/1.25 var(--f-display);font-variant-numeric:tabular-nums;margin-top:4px;overflow-wrap:anywhere}
.tile small{color:var(--ink-2);font-size:13px}
.tile.bad b{color:var(--bad)}.tile.warn b{color:var(--warn)}.tile.ok b{color:var(--ok)}
.pproj{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;margin-bottom:16px;overflow:hidden}
.pp-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;padding:14px 16px;border-bottom:1px solid var(--rule)}
.pp-h h3{font:600 16px var(--f-display)}
.linkish{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.linkish:hover{color:var(--stamp)}
.pp-h .mono{font-weight:500}
.pord{border-top:1px solid var(--rule)}
.pord:first-of-type{border-top:0}
.po-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 16px;background:var(--paper);font-size:14px}
.po-h button{border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:600;color:var(--ink)}
.po-h button:hover{color:var(--stamp)}

/* Plan */
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink-2);align-items:center;flex-wrap:wrap}
.legend span{display:flex;gap:6px;align-items:center}
.gantt{--lw:260px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow-x:auto}
@media (max-width:640px){.gantt{--lw:150px}}
.g-row{display:flex;min-height:36px;border-top:1px solid var(--rule-2)}
.g-row:first-child{border-top:0}
.g-lab{flex:none;width:var(--lw);position:sticky;left:0;z-index:2;background:var(--sheet);padding:7px 12px;border-right:1px solid var(--rule);font-size:14px;min-width:0;overflow-wrap:anywhere}
.g-track{position:relative;flex:none;background-image:linear-gradient(to right,var(--rule) 1px,transparent 1px);background-size:calc(var(--dw)*7) 100%}
.gantt.day .g-track{background-image:linear-gradient(to right,var(--rule) 1px,transparent 1px),linear-gradient(to right,var(--rule-2) 1px,transparent 1px);background-size:calc(var(--dw)*7) 100%,var(--dw) 100%}
.g-head .g-lab,.g-head .g-track{background-color:var(--mute-soft)}
.g-head{min-height:44px;position:relative}
.g-head .g-lab{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);font-weight:600;display:flex;align-items:flex-end}
.g-m{position:absolute;top:4px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;padding-left:4px}
.g-w{position:absolute;bottom:4px;font:11px var(--f-mono);color:var(--ink-2);padding-left:3px;white-space:nowrap}
.g-proj .g-lab{font-weight:600;background:var(--paper)}
.g-proj .g-track{background-color:var(--paper)}
.g-ord .g-lab{font-size:13px;color:var(--ink-2);padding-left:20px}
.g-task .g-lab{padding-left:28px;cursor:pointer}
.g-task .g-lab:hover{color:var(--stamp)}
.g-lab small{display:block;color:var(--ink-2);font-size:12px}
.g-load .g-lab{font-weight:600;background:var(--mute-soft);font-size:13px}
.g-load .g-track{background-color:var(--mute-soft)}
.g-n{position:absolute;top:8px;text-align:center;font:600 12px/20px var(--f-mono);border-radius:4px;color:var(--ink)}
.g-n.p{background:var(--stamp-soft);color:var(--stamp)}
.g-n.c{background:var(--warn-soft);color:var(--warn)}
.tagc{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:600;background:var(--warn-soft);color:var(--warn);vertical-align:1px}
.bar.contr{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px)}
.bar{position:absolute;top:7px;height:22px;border-radius:5px;border:0;cursor:pointer;color:var(--sheet);font-size:12px;font-weight:500;padding:0 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.buy{background:var(--stamp)}
.bar.work{background:var(--work)}
.bar.done{opacity:.45}
.bar.late{box-shadow:0 0 0 2px var(--bad)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.7;z-index:1;pointer-events:none}
.g-dl{position:absolute;top:4px;bottom:4px;width:0;border-left:2px dashed var(--warn);pointer-events:none}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.35);z-index:20}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--sheet);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.d-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--rule)}
.d-head h2{font:600 17px/1.3 var(--f-display);overflow-wrap:anywhere}
.d-body{overflow-y:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:18px;flex:1}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 14px;font-size:14px;margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;overflow-wrap:anywhere}
.box{border:1px solid var(--rule);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.box.paid{border-color:var(--ok);background:var(--ok-soft)}
.box h4{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);min-width:0}
.form .wide{grid-column:1/-1}
.form .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.in,textarea{width:100%;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:70px}
.err{color:var(--bad);font-size:13px;min-height:1em}
@media (max-width:480px){.form{grid-template-columns:1fr}.kv{grid-template-columns:1fr;gap:1px}.kv dd{margin-bottom:8px}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:30;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){aside.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
.umenu{position:relative}
.ubtn{display:flex;gap:8px;align-items:center;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;font-size:14px;color:var(--ink);max-width:240px}
.ubtn:hover{border-color:var(--ink-2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--stamp-soft);color:var(--stamp);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none;letter-spacing:.02em}
.ubtn .uname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ubtn svg{flex:none;color:var(--ink-2)}
.upop{position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:15;display:flex;flex-direction:column}
.upop .uinfo{padding:8px 10px 10px;border-bottom:1px solid var(--rule-2);margin-bottom:4px}
.upop .uinfo b{display:block;font-weight:600;overflow-wrap:anywhere}
.upop .uinfo small{color:var(--ink-2);font-size:12px}
.upop button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink)}
.upop button:hover{background:var(--mute-soft)}
.upop button.danger{color:var(--bad)}
@media (max-width:640px){.ubtn .uname{display:none}.ubtn{padding-right:6px}}
@media (max-width:900px){header.top .brand{flex:1;min-width:0}nav.views{order:3;width:100%}}
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login form{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.login h1{font-size:18px}
.login label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
.pw{position:relative;display:block}
.pw .in{padding-right:44px}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:32px;border:0;background:transparent;color:var(--ink-2);border-radius:6px;cursor:pointer;display:grid;place-items:center}
.pw-eye:hover{color:var(--ink);background:var(--mute-soft)}
.pw-eye[aria-pressed="false"] .pw-slash{display:none}
.login p{margin:0;font-size:14px;color:var(--ink-2)}
body.no-edit [data-act=newCp],body.no-edit [data-act=editCp],body.no-edit [data-act=newContract],body.no-edit [data-act=delContract],body.no-edit [data-act=newProject],body.no-edit [data-act=editProject],body.no-edit [data-act=newOrder],body.no-edit [data-act=editOrder],
body.no-edit [data-act=addComp],body.no-edit [data-act=delComp],body.no-edit [data-act=paste],body.no-edit [data-act=newInvoice],
body.no-edit [data-act=editInvoice],body.no-edit [data-act=delInvoice],body.no-edit [data-act=newTask],body.no-edit [data-act=delSpec],
body.no-edit label:has(> [data-up=spec]){display:none!important}
body.no-edit.can-invoice [data-act=newInvoice],body.no-edit.can-invoice .own[data-act=editInvoice],body.no-edit.can-invoice .own[data-act=delInvoice]{display:inline-flex!important}
body.no-edit .comp input,body.no-edit .comp select{pointer-events:none}
body.no-edit .g-task .g-lab,body.no-edit .bar,body.no-edit .tlist li{pointer-events:none}

<body>
<div class="login" id="loginView" hidden>
  <form id="loginForm" novalidate>
    <div class="brand"><h1>Управление предприятием</h1></div>
    <p id="l-hint" hidden>Первый запуск. Создайте учётную запись администратора: он добавит остальных сотрудников.</p>
    <label id="l-name-wrap" hidden>Ваше имя<input class="in" id="l-name" autocomplete="name" placeholder="Иванов И. И."></label>
    <label>Логин<input class="in" id="l-login" autocomplete="username" required></label>
    <label>Пароль<span class="pw"><input class="in" id="l-pass" type="password" autocomplete="current-password" required><button type="button" class="pw-eye" data-pw-toggle aria-label="Показать пароль" aria-pressed="false" title="Показать пароль"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path class="pw-slash" d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></span></label>
    <div class="err" id="l-err"></div>
    <button class="btn primary" type="submit" id="l-btn">Войти</button>
  </form>
</div>
<div id="app" hidden>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div><h1>Управление предприятием</h1><p class="sub">Заказы, контрагенты, документы, счета и план-график</p></div>
    </div>
    <nav class="views" id="views">
      <a href="#orders" data-v="orders">Заказы</a>
      <a href="#cps" data-v="cps">Контрагенты</a>
      <a href="#pay" data-v="pay">Бухгалтерия <span class="badge" id="payBadge" hidden></span></a>
      <a href="#plan" data-v="plan">План-график</a>
      <a href="#users" data-v="users" id="usersTab" hidden>Пользователи</a>
    </nav>
    <div class="umenu" id="umenu">
      <button class="ubtn" id="ubtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="upop"><span class="avatar" id="uav"></span><span class="uname" id="uname"></span><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="upop" id="upop" role="menu" hidden>
        <div class="uinfo"><b id="uname2"></b><small id="urole"></small></div>
        <button type="button" role="menuitem" data-act="password">Сменить пароль</button>
        <button type="button" role="menuitem" class="danger" data-act="logout">Выйти</button>
      </div>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="banner" id="banner" hidden></div>
  <div id="view"></div>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true"></aside>
<div class="toast" id="toast" hidden></div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,'0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtD = d => d ? d.split('-').reverse().join('.') : '—';
const num = v => { const n = parseFloat(String(v ?? '').replace(/\s| /g,'').replace(',','.')); return isFinite(n) ? n : 0; };
const money = n => (Number(n)||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ₽';
const dnum = s => Math.round(Date.parse(s+'T00:00:00Z')/864e5);
const dstr = n => new Date(n*864e5).toISOString().slice(0,10);
const fmtDT = iso => { const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); };
const initials = n => String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();
const fmtSize = n => n > 1048576 ? (n/1048576).toFixed(1)+' МБ' : Math.max(1,Math.round((n||0)/1024))+' КБ';
const fileUrl = f => f.url || ('/files/'+f.id);
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const ACCEPT = '';
const MAX_MB = 50;

const ORDER_ST = { new:'Планируется', work:'В работе', closed:'Закрыт' };
const CP_ROLES = { customer:'Заказчик', supplier:'Поставщик', contractor:'Подрядчик' };
const COMP_ST = { need:'Нужно заказать', ordered:'Заказано', got:'Получено' };
const KIND = { buy:'Закупка', work:'Работа' };
const ROLE_NAMES = { admin:'Администратор', manager:'Менеджер', accountant:'Бухгалтер', user:'Сотрудник', viewer:'Просмотр' };
const ROLE_INFO = {
  admin:'Всё, включая управление пользователями.',
  manager:'Заказы, контрагенты и договоры, документы, компоненты, счета, план-график. Оплату не отмечает.',
  accountant:'Видит всё, отмечает оплату и прикладывает чеки. Его скачивание счёта отмечается у остальных.',
  user:'Видит всё, загружает счета в заказы, правит и удаляет свои неоплаченные счета.',
  viewer:'Только просмотр.'
};

const S = { projects:[], orders:[], invoices:[], tasks:[], counterparties:[] };
let me = null, rev = -1, mode = 'loading';
const canEdit = () => me && (me.role === 'admin' || me.role === 'manager');
const canPay = () => me && (me.role === 'admin' || me.role === 'accountant');
const canAddInvoice = () => canEdit() || (me && me.role === 'user');
const ownInv = i => me && me.role === 'user' && i.createdBy === me.id && i.status !== 'paid';
const isAccountant = () => me && me.role === 'accountant';
const unseen = i => i.status === 'topay' && i.file && !i.seenAt;
let names = {};
const ui = { view:'orders', order:null, cp:null, cq:'', drafts:{}, payF:'topay', payOrd:'', planOrd:'', oq:'', scale:'day', drawer:null, armed:null };
try { const s = JSON.parse(localStorage.getItem('sed2')||'{}'); Object.assign(ui, { scale:s.scale||'day', order:s.order||null }); } catch(e){}
const remember = () => { try { localStorage.setItem('sed2', JSON.stringify({scale:ui.scale, order:ui.order})); } catch(e){} };

const ord = id => S.orders.find(o => o.id === id);
const inv = id => S.invoices.find(i => i.id === id);
const ordersSorted = () => S.orders.slice().sort((a,b) => (b.number||'').localeCompare(a.number||'','ru',{numeric:true}));
const cpOf = id => S.counterparties.find(c => c.id === id);
const cpsSorted = () => S.counterparties.slice().sort((a,b) => (a.name||'').localeCompare(b.name||'','ru'));
const cpByName = n => { const k = String(n||'').trim().toLowerCase(); return k ? S.counterparties.find(c => (c.name||'').trim().toLowerCase() === k) : null; };
const custName = o => (o && (cpOf(o.customerId)?.name || o.customer)) || '';
const brigadesOf = t => t.brigades != null ? (Number(t.brigades) || 0) : (t.contractors ? 1 : 0);
const crew = t => [t.people ? `${t.people} чел.` : '', brigadesOf(t) ? `${brigadesOf(t)} бр. подрядчиков` : ''].filter(Boolean).join(' + ');
const crewShort = t => [t.people ? `${t.people} чел.` : '', brigadesOf(t) ? `${brigadesOf(t)} бр.` : ''].filter(Boolean).join(' + ');
function nextOrderNumber(){
  const parsed = S.orders.map(o => /^(.*?)(\d+)$/.exec(String(o.number||'').trim())).filter(Boolean);
  if (!parsed.length) return 'З-1';
  const last = S.orders.slice().sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''))
    .map(o => /^(.*?)(\d+)$/.exec(String(o.number||'').trim())).find(Boolean) || parsed[0];
  const prefix = last[1], width = last[2].length;
  const max = Math.max(...parsed.filter(m => m[1] === prefix).map(m => Number(m[2])));
  return prefix + String(max + 1).padStart(width, '0');
}
const ordName = o => o ? `Заказ ${o.number} · ${o.title}` : 'Заказ не найден';
const invOf = oid => S.invoices.filter(i => i.orderId === oid);
const tasksOf = oid => S.tasks.filter(t => t.orderId === oid).sort((a,b) => (a.start||'').localeCompare(b.start||''));
const exTag = x => x?.example ? '<span class="ex">пример</span>' : '';
const daysLeft = i => i.due ? dnum(i.due) - dnum(today()) : null;
const soon = i => { const d = daysLeft(i); return i.status === 'topay' && d !== null && d >= 0 && d <= 3; };
const invChip = i => i.status === 'paid' ? ['c-ok','Оплачен'] : soon(i) ? ['c-warn','Срочно'] : ['c-info','К оплате'];
const who = id => id ? (names[id] || 'Сотрудник') : '—';
const sum = (arr, f) => arr.reduce((s,x) => s + num(f(x)), 0);

function toast(m){ const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2800); }
function errText(err){
  return (err?.message || 'Нет связи с сервером').replace(/\.$/,'') + '.';
}
const guard = p => Promise.resolve(p).catch(e => toast('Не сохранено: ' + errText(e)));

/* ---------- data layer (REST API) ---------- */
async function api(method, url, body, headers = {}){
  let r;
  try {
    r = await fetch(url, { method, credentials:'same-origin', headers: { 'X-Sed':'1', ...(body && !(body instanceof Blob) ? {'Content-Type':'application/json'} : {}), ...headers },
      body: body instanceof Blob ? body : body ? JSON.stringify(body) : undefined });
  } catch(e) { throw { message:'Нет связи с сервером' }; }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !url.endsWith('/login')) { showLogin(); throw { message:'Сеанс завершён, войдите снова' }; }
  if (!r.ok) throw { message: j.error || ('Ошибка сервера ' + r.status), status:r.status };
  return j;
}
async function refresh(){
  const d = await api('GET', '/api/data');
  rev = d.rev; names = d.users || {};
  ['projects','orders','invoices','tasks','counterparties'].forEach(c => S[c] = d[c] || []);
  if (mode !== 'live') { mode = 'live'; }
  $('banner').hidden = true;
  render();
  if (ui.drawer?.kind === 'invoice' && !drawerBusy() && !$('drawer').querySelector('form')) renderDrawer();
}
async function add(col, data){ const r = await api('POST', '/api/'+col, data); await refresh(); return r.id; }
async function upd(col, id, patch){
  const o = S[col].find(x => x.id === id); if (o) Object.assign(o, patch);
  try { await api('PATCH', `/api/${col}/${id}`, patch); }
  finally { refresh().catch(() => {}); }
}
async function del(col, id){ await api('DELETE', `/api/${col}/${id}`); await refresh(); }
async function upload(file){
  if (file.size > MAX_MB*1048576) throw { message:`Файл «${file.name}» больше ${MAX_MB} МБ` };
  return api('POST', '/api/files', file, { 'Content-Type': file.type || 'application/octet-stream', 'X-Filename': encodeURIComponent(file.name) });
}
function resolveNames(){}

/* ---------- render ---------- */
let pending = false;
function render(){
  if (document.activeElement?.closest('[data-keep]')) { pending = true; return; }
  pending = false;
  document.querySelectorAll('#views a').forEach(a => a.classList.toggle('on', a.dataset.v === ui.view));
  const n = S.invoices.filter(i => i.status === 'topay').length;
  $('payBadge').hidden = !n; $('payBadge').textContent = n;
  const V = $('view');
  if (mode === 'loading') { V.innerHTML = `<div class="empty"><h3>Загружаем данные…</h3>Подключаемся к общему хранилищу.</div>`; return; }
  V.innerHTML = ui.view === 'pay' ? vPay() : ui.view === 'plan' ? vPlan() : ui.view === 'users' ? vUsers() : ui.view === 'cps' ? vCps() : vOrders();
}
document.addEventListener('focusout', () => setTimeout(() => { if (pending && !document.activeElement?.closest('[data-keep]')) render(); }, 0));

function armBtn(key, label, act, id, cls='btn sm danger'){
  return `<button type="button" class="${cls}" data-act="${act}" data-id="${esc(id)}" data-arm="${esc(key)}" data-label="${esc(label)}">${label}</button>`;
}

/* ===== Orders view ===== */
function vOrders(){
  if (!S.orders.length) return `<div class="empty"><h3>Пока нет ни одного заказа</h3>Создайте заказ: в нём хранятся спецификации, компоненты, счета и задачи план-графика.<div class="row-g"><button class="btn primary" data-act="newOrder">+ Заказ</button></div></div>`;
  const o = ord(ui.order);
  const q = ui.oq.trim().toLowerCase();
  const items = Object.entries(ORDER_ST).map(([st, label]) => {
    const os = ordersSorted().filter(x => (x.status || 'new') === st);
    if (!os.length) return '';
    const open = st !== 'closed' || q || os.some(x => x.id === ui.order) || ui.openClosed;
    return `<details class="ogroup" data-st="${st}" ${open?'open':''}><summary>${label}<span class="cnt">${os.length}</span></summary>${os.map(x => orderItem(x, q)).join('')}</details>`;
  }).join('');
  return `<div class="split ${o?'has-sel':''}">
    <nav class="olist" aria-label="Заказы">
      <div class="olist-top"><span data-keep style="display:contents"><input class="in" id="oq" type="search" placeholder="Поиск: номер, название, заказчик" value="${esc(ui.oq)}" aria-label="Поиск заказа"></span><button class="btn primary" data-act="newOrder">+ Заказ</button></div>
      <div class="pgroup" id="olist">${items}<p class="pad dim" id="onone" ${ordersSorted().some(x => matchOrder(x, q)) ? 'hidden' : ''}>Ничего не найдено</p></div>
    </nav>
    <section class="odetail">${o ? orderDetail(o) : `<div class="empty"><h3>Выберите заказ</h3>Откройте заказ слева, чтобы загрузить спецификацию, заполнить компоненты и добавить счета.</div>`}</section>
  </div>`;
}
const orderHay = x => [x.number, x.title, custName(x), x.billNo].join(' ').toLowerCase();
const matchOrder = (x, q) => !q || orderHay(x).includes(q);
const billText = o => !!(o && o.billNo);
function orderItem(x, q){
  const cm = Array.isArray(x.comments) ? x.comments : [];
  const last = cm[cm.length - 1];
  return `<button class="oitem ${ui.order===x.id?'on':''}" data-act="selOrder" data-id="${x.id}" data-q="${esc(orderHay(x))}" ${matchOrder(x, q)?'':'hidden'}>
    <span class="mono">Заказ ${esc(x.number)}${x.billNo?` · сч. ${esc(x.billNo)}`:''}</span><span class="ot">${esc(x.title)}${exTag(x)}</span>${custName(x)?`<span class="oc">${esc(custName(x))}</span>`:''}
    ${last ? `<span class="ocm" title="${esc(last.text)}"><b>${esc(who(last.by))}:</b> ${esc(last.text.slice(0,120))}${cm.length > 1 ? ` · ещё ${cm.length - 1}` : ''}</span>` : ''}
  </button>`;
}
function orderDetail(o){
  const comps = o.components || [];
  const is = invOf(o.id).sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const ts = tasksOf(o.id);
  const cm = Array.isArray(o.comments) ? o.comments : [];
  const canComment = me && me.role !== 'viewer';
  const specs = o.specs || [];
  return `<button class="btn ghost back" data-act="back">← Все заказы</button>
  <div class="ohead">
    <div style="min-width:0">

/* ===== Accounting view ===== */
function vPay(){
  const all = S.invoices.filter(i => !ui.payOrd || i.orderId === ui.payOrd);
  const topay = all.filter(i => i.status === 'topay');
  const F = { new: unseen, topay: i => i.status==='topay', paid: i => i.status==='paid', all: () => true };
  const list = all.filter(F[ui.payF] || F.all);
  const nNew = all.filter(unseen).length;
  const withFiles = topay.filter(i => i.file).length;
  const seg = [['new', 'Не скачанные' + (nNew ? ` (${nNew})` : '')],['topay','К оплате'],['paid','Оплаченные'],['all','Все']];
  const zipHref = '/api/invoices-zip' + (ui.payOrd ? '?order=' + encodeURIComponent(ui.payOrd) : '');
  const head = `<div class="toolbar">
    <div class="seg" role="tablist">${seg.map(([k,l]) => `<button data-act="payF" data-id="${k}" class="${ui.payF===k?'on':''}">${l}</button>`).join('')}</div>
    <select class="f" id="payOrd" aria-label="Заказ"><option value="">Все заказы</option>${ordersSorted().map(o => `<option value="${o.id}" ${ui.payOrd===o.id?'selected':''}>${esc(o.number+' · '+o.title)}</option>`).join('')}</select>
    ${canPay() ? (topay.length ? `<a class="btn" href="${zipHref}" data-dl title="ZIP-архив: файлы счетов по папкам заказов и реестр в CSV">Скачать ${ui.payOrd ? 'счета заказа' : 'все счета'} к оплате${withFiles ? ` · файлов: ${withFiles}` : ''}</a>` : '<button class="btn" disabled>Скачать все счета к оплате</button>') : ''}
    ${canAddInvoice() && S.orders.length ? '<button class="btn primary" data-act="newInvoice" data-id="">+ Счёт</button>' : ''}
  </div>
  <div class="tiles"><div class="tile"><span>К оплате</span><b>${money(sum(topay,i=>i.amount))}</b><small>${topay.length} сч.</small></div></div>`;
  if (!S.invoices.length) return head + `<div class="empty"><h3>Счетов пока нет</h3>Счета добавляются в карточке заказа на вкладке «Заказы» и сразу появляются здесь.</div>`;
  if (!list.length) return head + `<div class="empty"><h3>${ui.payF==='topay'?'Все счета оплачены':'Нет счетов по этому фильтру'}</h3>Выберите другой фильтр или заказ.</div>`;
  const sorter = ui.payF === 'paid' ? (a,b) => (b.paidAt||'').localeCompare(a.paidAt||'') : (a,b) => (a.status===b.status?0:a.status==='topay'?-1:1) || (a.due||'9').localeCompare(b.due||'9');
  const groups = new Map();
  list.forEach(i => { const k = i.orderId || '_'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(i); });
  const keys = [...groups.keys()].sort((a,b) => (ord(b)?.number||'').localeCompare(ord(a)?.number||'','ru',{numeric:true}));
  return head + keys.map(k => {
    const o = ord(k), is = groups.get(k).sort(sorter);
    const due = sum(is.filter(i => i.status==='topay'), i => i.amount);
    return `<section class="pproj"><div class="pp-h"><h3><button class="linkish" data-act="gotoOrder" data-id="${k}">${esc(ordName(o))}</button></h3>
      <span class="dim">${o?.billNo?`выставлен счёт № ${esc(o.billNo)}${o.billDate?' от '+fmtD(o.billDate):''} · `:''}к оплате <span class="mono" style="color:var(--ink)">${money(due)}</span></span></div>
      <div class="ilist">${is.map(i => invRow(i,true)).join('')}</div></section>`;
  }).join('');
}

/* ===== Plan view ===== */
function vPlan(){
  const tasks = S.tasks.filter(t => t.start && t.end && (!ui.planOrd || (ui.planOrd === '_' ? !ord(t.orderId) : t.orderId === ui.planOrd)));
  const head = `<div class="toolbar">
    <select class="f" id="planOrd" aria-label="Заказ"><option value="">Все заказы</option><option value="_" ${ui.planOrd==='_'?'selected':''}>Общие работы</option>${ordersSorted().map(o => `<option value="${o.id}" ${ui.planOrd===o.id?'selected':''}>${esc(o.number+' · '+o.title)}</option>`).join('')}</select>
    <div class="seg"><button data-act="scale" data-id="day" class="${ui.scale==='day'?'on':''}">Дни</button><button data-act="scale" data-id="week" class="${ui.scale==='week'?'on':''}">Недели</button></div>
    <button class="btn primary" data-act="newTask" data-id="${ui.planOrd && ui.planOrd !== '_' ? ui.planOrd : ''}">+ Задача</button>
    <div class="legend"><span><i class="dot buy"></i>Закупка</span><span><i class="dot work"></i>Работа</span><span><i class="dot work" style="background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.45) 0 2px,transparent 2px 4px)"></i>С подрядчиками</span><span><i class="dot" style="background:var(--bad);width:2px;height:14px"></i>Сегодня</span><span><i class="dot" style="border-left:2px dashed var(--warn);border-radius:0;width:2px;height:14px"></i>Срок заказа</span></div>
  </div>`;
  if (!tasks.length) return head + `<div class="empty"><h3>План-график пуст</h3>Добавьте закупку или работу с датами начала и окончания, количеством своих людей и бригад подрядчиков. Задачу можно привязать к заказу.</div>`;
  const tn = dnum(today());
  let lo = Math.min(tn, ...tasks.map(t => dnum(t.start))) - 3;
  let hi = Math.max(tn, ...tasks.map(t => dnum(t.end))) + 10;
  lo -= (lo + 3) % 7;
  if (hi - lo < 48) hi = lo + 48;
  const days = hi - lo + 1, DW = ui.scale === 'week' ? 10 : 26, W = days * DW;
  let months = '', weeks = '';
  for (let d = lo; d <= hi; d++) {
    const s = dstr(d);
    if (d === lo || s.endsWith('-01')) months += `<span class="g-m" style="left:${(d-lo)*DW}px">${MONTHS[Number(s.slice(5,7))-1]} ${s.slice(0,4)}</span>`;
    if ((d - lo) % 7 === 0 && (ui.scale === 'day' || (d - lo) % 14 === 0)) weeks += `<span class="g-w" style="left:${(d-lo)*DW}px">${s.slice(8)}.${s.slice(5,7)}</span>`;
  }
  const todayLine = `<i class="g-today" style="left:${(tn-lo)*DW + DW/2 - 1}px"></i>`;
  const track = (inner, extra='') => `<div class="g-track" style="width:${W}px">${todayLine}${extra}${inner}</div>`;
  const tip = t => `${t.title}: ${fmtD(t.start)} – ${fmtD(t.end)}${crew(t)?' · '+crew(t):''}${t.resp?' · '+t.resp:''}`;
  const bar = t => {
    const s = dnum(t.start), e = Math.max(s, dnum(t.end)), w = (e - s + 1) * DW;
    const late = !t.done && e < tn;
    const text = (t.done?'✓ ':'') + t.title + (crewShort(t) ? ' · ' + crewShort(t) : '');
    return `<button class="bar ${t.kind} ${t.done?'done':''} ${late?'late':''} ${brigadesOf(t)?'contr':''}" style="left:${(s-lo)*DW}px;width:${w}px" data-act="editTask" data-id="${t.id}" title="${esc(tip(t))}">${w > 70 ? esc(text) : ''}</button>`;
  };
  const meta = t => [KIND[t.kind], crew(t), t.resp].filter(Boolean).map(esc).join(' · ');
  const taskRow = t => `<div class="g-row g-task"><div class="g-lab" data-act="editTask" data-id="${t.id}" role="button" tabindex="0">${t.done?'✓ ':''}${esc(t.title)}${exTag(t)}<small>${meta(t)}</small></div>${track(bar(t))}</div>`;
  const byStart = (a,b) => a.start.localeCompare(b.start);
  let rows = '';
  ordersSorted().slice().reverse().forEach(o => {
    const ot = tasks.filter(t => t.orderId === o.id).sort(byStart); if (!ot.length) return;
    const dl = o.deadline && dnum(o.deadline) >= lo && dnum(o.deadline) <= hi ? `<i class="g-dl" style="left:${(dnum(o.deadline)-lo)*DW + DW - 1}px" title="Срок сдачи заказа ${fmtD(o.deadline)}"></i>` : '';
    rows += `<div class="g-row g-proj"><div class="g-lab">Заказ ${esc(o.number)} · ${esc(o.title)}</div>${track('', dl)}</div>` + ot.map(taskRow).join('');
  });
  const common = tasks.filter(t => !ord(t.orderId)).sort(byStart);
  if (common.length) rows += `<div class="g-row g-proj"><div class="g-lab">Общие работы</div>${track('')}</div>` + common.map(taskRow).join('');

  // people and contractors per day (week scale: maximum within the week)
  const per = [], con = [];
  for (let d = lo; d <= hi; d++) { per.push(0); con.push(0); }
  tasks.forEach(t => {
    const s = Math.max(lo, dnum(t.start)), e = Math.min(hi, Math.max(dnum(t.start), dnum(t.end)));
    for (let d = s; d <= e; d++) { per[d-lo] += Number(t.people) || 0; con[d-lo] += brigadesOf(t); }
  });
  const cells = (arr, cls) => {
    let h = '';
    if (ui.scale === 'day') arr.forEach((n, k) => { if (n) h += `<span class="g-n ${cls}" style="left:${k*DW+2}px;width:${DW-4}px">${n}</span>`; });
    else for (let k = 0; k < arr.length; k += 7) { const n = Math.max(...arr.slice(k, k+7)); if (n) h += `<span class="g-n ${cls}" style="left:${k*DW+2}px;width:${7*DW-4}px" title="наибольшее за неделю">${cls==='p'?'до ':''}${n}</span>`; }
    return h;
  };
  const hasPeople = per.some(Boolean), hasCon = con.some(Boolean);
  if (hasPeople) rows += `<div class="g-row g-load"><div class="g-lab">Своих людей${ui.scale==='week'?' (макс. в неделю)':' в день'}</div>${track(cells(per,'p'))}</div>`;
  if (hasCon) rows += `<div class="g-row g-load"><div class="g-lab">Бригад подрядчиков${ui.scale==='week'?' (макс.)':' в день'}</div>${track(cells(con,'c'))}</div>`;
  return head + `<div class="gantt ${ui.scale}" style="--dw:${DW}px"><div style="width:calc(var(--lw) + ${W}px)">
    <div class="g-row g-head"><div class="g-lab">Задача</div><div class="g-track" style="width:${W}px">${months}${weeks}</div></div>${rows}
  </div></div>`;
}

      <p style="margin:0">Скопируйте строки в Excel и вставьте сюда. Порядок столбцов:<br><b>Наименование · Артикул · Кол-во · Ед. · Цена · Поставщик</b>. Строку заголовков можно не удалять.</p>
      <textarea id="paste-t" rows="10" class="mono" placeholder="Автоматический выключатель 3P 16А&#9;BA47-29&#9;12&#9;шт&#9;845,50&#9;ЭлектроКомплект"></textarea>

      <div class="err" id="ferr"></div>

  }
}
function parsePaste(text){
  const lines = text.split(/\r?\n/).map(l => l.trim() ? l.split(l.includes('\t') ? '\t' : ';') : null).filter(Boolean);
  if (lines.length && !num(lines[0][2]) && /наимен|name|артик|кол/i.test(lines[0].join(' '))) lines.shift();
  return lines.map(c => ({ id:uid(), name:(c[0]||'').trim(), pn:(c[1]||'').trim(), qty:num(c[2]) || 1, unit:(c[3]||'шт').trim() || 'шт', price:num(c[4]), supplier:(c[5]||'').trim(), st:'need' })).filter(c => c.name);
}

/* ---------- submit ---------- */
async function onSubmit(e){
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, d = ui.drawer;
  const val = id => ($(id)?.value || '').trim();
  const fail = m => { const el = f.querySelector('.err'); if (el) el.textContent = m; };
  const btn = f.querySelector('[type=submit]');
  const now = new Date().toISOString();
  try {
    btn.disabled = true;
    if (kind === 'order') {
      if (!val('f-num') || !val('f-title')) return fail('Укажите номер и наименование заказа.');
      const dup = S.orders.find(x => x.id !== d.id && String(x.number||'').trim().toLowerCase() === val('f-num').toLowerCase());
      if (dup) return fail(`Номер ${val('f-num')} уже есть у заказа «${dup.title}». Укажите другой.`);
      let cust = cpByName(val('f-cust'));
      if (!cust && val('f-cust')) { const cid = await add('counterparties', { name:val('f-cust'), roles:['customer'], contracts:[], createdAt:now }); cust = cpOf(cid) || { id:cid, name:val('f-cust') }; toast('Контрагент «' + val('f-cust') + '» добавлен'); }
      const data = { number:val('f-num'), status:val('f-st'), title:val('f-title'), customerId: cust ? cust.id : null, customer: cust ? cust.name : '', deadline:val('f-dl'), billNo:val('f-bill'), billDate:val('f-billdate') };
      if (d.id) { await upd('orders', d.id, data); }
      else { const id = await add('orders', { ...data, components:[], specs:[], createdAt:now }); ui.order = id; remember(); }
      closeDrawer(); render(); toast(d.id ? 'Заказ сохранён' : 'Заказ создан');
    }
    if (kind === 'cp') {
      const name = val('cp-name'); if (!name) return fail('Укажите название контрагента.');
      const same = cpByName(name); if (same && same.id !== d.id) return fail('Контрагент с таким названием уже есть.');
      const data = { name, roles:[...f.querySelectorAll('[name=cp-role]:checked')].map(x => x.value), inn:val('cp-inn'), person:val('cp-person'), phone:val('cp-phone'), email:val('cp-email'), address:val('cp-addr'), bank:$('cp-bank').value.trim(), notes:$('cp-notes').value.trim() };
      if (d.id) await upd('counterparties', d.id, data);
      else { const id = await add('counterparties', { ...data, contracts:[], createdAt:now }); ui.cp = id; }
      closeDrawer(); render(); toast(d.id ? 'Сохранено' : 'Контрагент добавлен');
    }
    if (kind === 'contract') {
      const file = $('k-file').files[0]; if (!file) return fail('Выберите файл договора.');
      fail('Загружаем файл…');
      const up = await upload(file);
      const c = cpOf(d.id);
      await upd('counterparties', d.id, { contracts:[...(c.contracts||[]), { id:uid(), number:val('k-num'), date:val('k-date'), subject:val('k-subj'), file:up, at:now }] });
      closeDrawer(); render(); toast('Договор загружен');
    }
    if (kind === 'invoice') {
      const o = ord(val('f-ord'));
      if (!o) return fail('Выберите заказ. Если заказов нет, сначала создайте его.');
      if (!val('f-num') || !val('f-sup')) return fail('Укажите номер счёта и поставщика.');
      if (!(num(val('f-amt')) > 0)) return fail('Укажите сумму счёта.');

      toast(d.id ? 'Счёт сохранён' : 'Счёт добавлен и передан в бухгалтерию');
    }
    if (kind === 'pay') {
      if (!val('p-date')) return fail('Укажите дату оплаты.');
      const patch = { status:'paid', paidAt:val('p-date'), payNo:val('p-no'), paidAmount:num(val('p-amt')) || inv(d.id).amount, paidBy:me };
      const file = $('p-file').files[0];
      if (file) { fail('Загружаем чек…'); patch.receipt = await upload(file); }
      await upd('invoices', d.id, patch); renderDrawer(); render();
      toast(file ? 'Оплата отмечена, чек приложен' : 'Оплата отмечена');
    }
    if (kind === 'task') {
      const tg = val('t-target');
      if (!val('t-title')) return fail('Укажите название задачи.');
      const people = val('t-people') === '' ? 0 : Math.round(num(val('t-people')));
      if (people < 0 || people > 999) return fail('Количество людей — от 0 до 999.');
      const s = val('t-start'), en = val('t-end');
      if (!s || !en) return fail('Укажите даты начала и окончания.');
      if (en < s) return fail('Окончание не может быть раньше начала.');
      const brigades = val('t-brig') === '' ? 0 : Math.round(num(val('t-brig')));
      if (brigades < 0 || brigades > 99) return fail('Бригад подрядчиков — от 0 до 99.');
      const data = { orderId: tg || null, kind:val('t-kind'), resp:val('t-resp'), title:val('t-title'), start:s, end:en, done:$('t-done').checked,
        people, brigades, contractors: brigades > 0, contractorsNote: '' };
      if (d.id) await upd('tasks', d.id, data); else await add('tasks', { ...data, createdAt:now });
      closeDrawer(); render(); toast(d.id ? 'Задача сохранена' : 'Задача добавлена в план-график');
    }
    if (kind === 'userForm') {
      const body = { name:val('uf-name'), login:val('uf-login'), role:$('uf-role').value };
      const pw = $('uf-pass').value;
      if (d.id) {
        if (pw) body.password = pw;
        if (d.id === me.id) delete body.role;
        await api('PATCH', '/api/users/' + d.id, body);
        toast('Сохранено');
      } else {
        await api('POST', '/api/users', { ...body, password:pw });
        toast('Пользователь добавлен');
      }
      closeDrawer(); await loadUsers();
    }
    if (kind === 'password') {
      await api('POST', '/api/password', { current:$('pw-cur').value, next:$('pw-new').value });
      closeDrawer(); toast('Пароль изменён');
    }
    if (kind === 'paste') {
      const rows = parsePaste($('paste-t').value);
      if (!rows.length) return fail('Не нашлось строк с наименованием. Проверьте, что столбцы разделены табуляцией.');
      const o = ord(d.id);
      await upd('orders', o.id, { components:[...(o.components||[]), ...rows] });
      closeDrawer(); render(); toast(`Добавлено строк: ${rows.length}`);
    }
  } catch(err) { fail(errText(err)); }
  finally { if (btn) btn.disabled = false; }
}
