# /etc/nginx/sites-available/sed.example.ru
# Замените sed.example.ru на свой домен. Сертификат: sudo certbot --nginx -d sed.example.ru
server {
    listen 80;
    server_name sed.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sed.example.ru;

    ssl_certificate     /etc/letsencrypt/live/sed.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sed.example.ru/privkey.pem;

    client_max_body_size 55m;          # чуть больше MAX_FILE_MB (50 МБ)
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
